# ORG Mode para Eli: pruebas automáticas en cada PR (y a mano desde Actions).
# Jest y las E2E propias (e2e/eli) corren aquí, en GitHub, para no tener que
# instalarlo todo en cada sesión. Si algo falla, el informe de Playwright queda
# como artefacto «e2e-informe» de la ejecución.
name: Pruebas

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile --ignore-engines --ignore-scripts
      - name: Jest
        run: yarn --ignore-engines test --ci
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile --ignore-engines --ignore-scripts
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Compilar
        run: ./bin/compile_search_parser.sh && yarn -s --ignore-engines e2e:build
      # (4.12) Primero solo las E2E de la versión (los v4XX.spec.js cambiados en el PR, en los dos
      # proyectos): si fallan, se para aquí y el fallo llega en pocos minutos. Luego, el resto.
      - name: E2E nuevas de la versión
        id: nuevas
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'e2e/eli/tests/v4*.spec.js' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then echo "No hay E2E nuevas"; exit 0; fi
          echo "E2E nuevas: $FILES"
          yarn -s --ignore-engines e2e:run $FILES
        env:
          CI: true
      - name: E2E (el resto, ordenador + móvil)
        run: yarn -s --ignore-engines e2e:run
        env:
          CI: true
          E2E_SKIP: ${{ steps.nuevas.outputs.files }}
      - name: Guardar informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-informe
          path: test-results/e2e-eli
          retention-days: 7
